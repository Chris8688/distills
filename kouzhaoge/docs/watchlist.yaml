# 常驻阈值：没有到期日，每周/每月对照一次（他称为「最快最便宜的证伪信号」）
monitors:
  - id: spot-ddr5
    theme: 存储
    src: "K3 08-02"
    rule: "DDR5 16Gb 现货 < $45，或 DDR4 8Gb < $36，且连续 2 周净跌 → 周期顶信号（「空头有 6–8 周信息优势」）"
    cadence: 每周三 TrendForce 现货
  - id: spot-contract-gap
    theme: 存储
    src: "K3 09-26 / K2 07-08"
    rule: "现货与合约价出现裂口（现货转负、合约仍涨）→ 撤出通用 DRAM/NAND/模组敞口；做空须同时见到原厂 capex 转投消费级净扩产"
    cadence: 每周
  - id: realization-ratio
    theme: 存储
    src: "K3 08-02"
    rule: "实现率 = 公司 ASP 环比 ÷ 合约指数环比；连续三季 < 0.8x → 长约在吃上行（BEAR）"
    cadence: 每季财报
  - id: inventory-weeks
    theme: 存储
    src: "K1 06-23 / K3 08-02"
    rule: "原厂库存从 2~5 周回到 8 周以上；客户 >10 周且供应商 >6 周 = BEAR"
    cadence: 每季
  - id: margin-ceiling
    theme: 存储
    src: "K3 09-26 / K1 06-23"
    rule: "存储厂毛利率 ≥70% = 扩产动员令；美光毛利率连续两季环比下行（2018 模式：毛利先于营收见顶）"
    cadence: 每季财报
  - id: securitization
