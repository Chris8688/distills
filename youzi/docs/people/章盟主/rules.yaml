  - id: ZMZ-05
    category: 买点
    rule: 大资金主封龙头，不做一日游，持股好几天
    quote: "敢于大资金参与封板，不一样的是章盟主不会一日游，一般都会格局好几天"
    source: text/章盟主-大神之路.md#page-8
