    rule: 强势上升股反复做T降低成本，一般翻倍才止盈
    quote: "不断做t降低成本，从低位做到高位一般翻倍才会止盈出局"
    source: text/章盟主-大神之路.md#page-8
    evidence: 二手
    codable: true
    signal: "持仓段累计收益 ≥ +100% → 止盈；之前按日内高抛低吸维持底仓"
