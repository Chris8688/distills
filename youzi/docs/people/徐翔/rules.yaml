rules:
  - id: XX-01
    category: 止损
    rule: 单票买入后跌超10%无条件止损，且不允许补仓
    quote: "买入后不能下跌超过10%，否则无条件止损，不允许补仓"
    source: text/我在泽熙学到的七堂课_徐翔_投机的心性_纯图版.md#page-5
    evidence: 二手
    codable: true
    signal: "close/entry_px - 1 ≤ -10% → 全部卖出；持仓浮亏时禁止加仓"
    data_check: "无数据（这是对研究员推荐的考核口径，非徐翔个人交易规则）"
  - id: XX-02
    category: 仓位
    rule: 不加杠杆，行情好时分红降规模
    quote: "我却没有见到泽熙加杠杆，相反，泽熙在年底大比例分红"
    source: text/我在泽熙学到的七堂课_徐翔_投机的心性_纯图版.md#page-7
    evidence: 二手
    codable: true
    signal: "gross_exposure ≤ 1.0；产品/账户年收益 > X → 分红出金"
    data_check: "无数据"
  - id: XX-03
    category: 止损
    rule: 黑天鹅连续跌停时，跌停第一次打开就全部卖出，之后再找低位抄底
    quote: "在酒鬼酒跌停第一次打开的时候，泽熙基本出光了，然后是27元勇敢的抄底"
    source: text/我在泽熙学到的七堂课_徐翔_投机的心性_纯图版.md#page-10
    evidence: 二手
    codable: true
    signal: "持仓连续一字跌停后首日盘中开板 → 当日清仓"
    data_check: "无数据"
  - id: XX-04
    category: 卖点
    rule: 逆向：市场观点一致、股价凌厉上涨时出局；涨停板满屏时警惕
    quote: "凡是行情最火爆，涨停板满屏的时候，总是心生寒意"
    source: text/我在泽熙学到的七堂课_徐翔_投机的心性_纯图版.md#page-6
    evidence: 二手
    codable: true
    signal: "全市场涨停家数 ≥ 250 日分位 95% → 风险标记（只作信息）"
    data_check: "无数据"
  - id: XX-05
    category: 买点
    rule: 利空出尽、连续跌停之后，情绪与基本面脱钩，可以博弈反弹
    quote: "重庆啤酒不是股票，是彩票"
    source: text/我在泽熙学到的七堂课_徐翔_投机的心性_纯图版.md#page-9
    evidence: 二手
    codable: false
    signal: "（部分）连续 ≥5 个跌停后首次放巨量开板 → 观察；不建议编码"
    data_check: "无数据"
  - id: XX-06
    category: 空仓
    rule: 避免频繁交易，无确定性机会时经常保持空仓
    quote: "一个成熟的交易者一定是经常保持空仓"
    source: text/总舵主炒股九大铁律.md#page-2
    evidence: 二手
    codable: false
    signal: ""
