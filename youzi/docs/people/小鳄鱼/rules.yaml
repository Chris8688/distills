person: 小鳄鱼
rules:
  - id: XEY-01
    category: 环境
    rule: 交易以"势"为核心，跟随共振上涨与共振下跌
    quote: 炒股基本靠势……把握好了这个势，共振上涨，共振下跌，交易的大部分基本就能解决
    source: text/58位·中册·第04章.md#page-64
    evidence: 二手
    codable: false
  - id: XEY-02
    category: 仓位
    rule: 行情好满仓追龙头；行情不好不追高，低吸为主或空仓
    quote: 行情好的时候满仓做，追龙头。行情不好不追高，低吸为主，或者空仓
    source: text/58位·中册·第04章.md#page-67
    evidence: 二手
    codable: true
    signal: 「T-1 涨停家数 ≥ 60 且 最高连板 ≥ 5 且 T-1 连板晋级率 ≥ 30%」→ 好行情（允许满仓、允许打板）；否则只允许低吸（买价 ≤ 前收×1.03）或空仓。阈值待用户样本标定
  - id: XEY-03
    category: 空仓
    rule: 熊市空仓，只做板块下跌一段后再次大幅下挫的超跌反弹
    quote: 熊市中空仓都是正确的……只能做一做超跌，也就是下跌一段时间后，板块再次大幅下挫的情况
    source: text/58位·中册·第04章.md#page-67
    evidence: 二手
    codable: true
    signal: 「指数收盘 < MA60 → 熊市态，默认空仓；例外：板块指数近 20 日跌幅 ≥ 15% 且 当日再跌 ≥ 4% → 次日允许超跌低吸」
  - id: XEY-04
    category: 止损
    rule: 连续亏损 2 笔就停止交易休息
    quote: 连续亏2笔就休息，一笔交易结束了再去考虑下一笔
    source: text/58位·中册·第04章.md#page-66
    evidence: 二手
    codable: true
    signal: 「最近 2 个已平仓持仓段均亏损 → 暂停新开仓 N 个交易日（N 待定，原文未给）」；同时持仓段数 ≤ 1
  - id: XEY-05
    category: 卖点
    rule: 隔日交易，持股 1-2 天，行情好可适当延长
    quote: 我的交易模式，基本是隔日交易，持股1-2天，行情好的时候可能适当增长持股时间
    source: text/58位·中册·第04章.md#page-67
    evidence: 二手
    codable: true
    signal: 「持有天数 ≤ 2 交易日强制离场；若持有期间每日涨停则顺延」
  - id: XEY-06
    category: 选股
    rule: 只做主流热点，其他小利放弃
    quote: 买入主流热点，其他的小利放弃
    source: text/58位·中册·第04章.md#page-65
    evidence: 二手
    codable: true
    signal: 「标的所属概念 = T-1 涨停家数最多的前 2 个概念之一」
  - id: XEY-07
    category: 买点
    rule: 题材股第一时间买入，不追太高；只有情绪很好时龙头可追
    quote: 必须第一时间买进，不可追太高（除非市场情绪很好，龙头可追）
    source: text/小鳄鱼_超短线的核心_纯图版.md#page-2
    evidence: 二手
    codable: false
  - id: XEY-08
    category: 买点
    rule: 主手法连板接力，其次人气股反包（仅大主流在时），再次热点+重磅消息补涨首板，新股开板接力少用
    quote: 最主要的手法是连板，其次是人气股反包战法……反包只有大主流在时才容易连板
    source: text/小鳄鱼_超短线的核心_纯图版.md#page-4
    evidence: 二手
    codable: true
    signal: 「连板接力：T-1 连板数 ≥ 2 且 首笔买价 = 涨停价」；「反包：T-1 收跌（非涨停）且 T-5 内有 ≥3 连板 且 当日首笔买入」
  - id: XEY-09
    category: 买点
    rule: 主线最强中军一波拉升后出现首根阴线，次日低吸
    quote: 最强一波拉伸首阴后的低吸，这个低吸非常完美
    source: text/小鳄鱼交歌单图文解读-8000到10亿.md#page-5
    evidence: 二手
    codable: true
    signal: 「近 10 日涨幅 ≥ 30% 且 T-1 收阴（收 < 开 且 跌幅 ≥ 3%）且 为板块成交额第一 → T 日买价 ≤ 前收」
  - id: XEY-10
    category: 选股
    rule: 主线内资金向最强中军集中时，换仓到最强中军/龙头
    quote: 当天中军带领券商继续走强，小鳄鱼换到最强中军上
    source: text/小鳄鱼交歌单图文解读-8000到10亿.md#page-6
    evidence: 二手
    codable: false
  - id: XEY-11
    category: 选股
    rule: 龙头判断看题材是否最易被市场承认，而非涨停先后或封单大小
    quote: 谁涨停谁就是龙头，谁封单越大谁就是领涨。那太浅薄了
    source: text/小鳄鱼交歌单图文解读-8000到10亿.md#page-27
    evidence: 二手
    codable: false
  - id: XEY-12
    category: 心态
    rule: 简单纯粹，只跟随不预判，只做自己的模式
    quote: 体会只有这4个字，简单，纯粹……只跟随，不预判
    source: text/58位·中册·第04章.md#page-65
    evidence: 二手
    codable: false
  - id: XEY-13
    category: 环境
    rule: 技术面只用 K 线、成交量、均线、分时
    quote: 技术分析主要用的是k线，成交量，均线和分时图的走势，其他的都不看
    source: text/58位·中册·第04章.md#page-68
    evidence: 二手
    codable: false
