person: Asking
# 语料：58位·上册·第03章（问答体，答案多为原句）+ Asking心法总结（篇1 为原句拼接；篇2 第12页起混入钢铁战士/深南中路，不计入）
# 记号：IDX=上证指数  AMT=两市成交额  pct250=滚动250日分位
rules:
  - id: AK-01
    category: 环境
    rule: 弱市不做是短线第一原则
    quote: 短线炒手必须遵循的第一原则弱市不做，弱市不操作就是最好的操作
    source: text/58位·上册·第03章.md#page-85
    evidence: 二手
    codable: true
    signal: "弱市 = IDX<MA20 且 MA20 斜率<0 → 不开新仓"
    data_check: 无 trades/
  - id: AK-02
    category: 空仓
    rule: 指数处于下跌通道时，所有符合条件的交易全部放弃
    quote: 指数在走下跌通道时，符合条件的交易，全部放弃，也不为错
    source: text/58位·上册·第03章.md#page-84
    evidence: 二手
    codable: true
    signal: "下跌通道 = IDX 收盘 < MA20 < MA60（待校准）→ 目标仓位 0"
    data_check: 无 trades/
  - id: AK-03
    category: 环境
    rule: 行情好坏只看量
    quote: 有量就能来钱，超短对行情好坏只有一个标准—--量能！
    source: text/58位·上册·第03章.md#page-92
    evidence: 二手
    codable: true
    signal: "量能好 = AMT 的 5 日均 > 20 日均 且 pct250(AMT) ≥ 50"
    data_check: 无 trades/
  - id: AK-04
    category: 仓位
    rule: 大盘量小、个股不活跃时少做并控制仓位
    quote: 大盘量小，个股活跃度欠佳，短线少做，仓位应当控制
    source: text/58位·上册·第03章.md#page-92
    evidence: 二手
    codable: true
    signal: "pct250(AMT)<20 且 涨停数 pct250<20 → 仓位上限 20%（待校准）"
    data_check: 无 trades/
  - id: AK-05
    category: 仓位
    rule: 行情好满仓滚动，行情差轻仓
    quote: 行情好时我都是满仓滚动操做，因为这时亏钱概率小。不好时应尽量轻仓小玩玩
    source: text/58位·上册·第03章.md#page-89
    evidence: 二手
    codable: true
    signal: "AK-03 量能好 且 非 AK-02 下跌通道 → 仓位上限 100%；否则 ≤20%"
    data_check: 无 trades/；同章#page-93 另说『行情好多做，一般都轻仓』（冲突）
  - id: AK-06
    category: 选股
    rule: 龙头看启动时机：先于大盘连续上涨并带动关联个股
    quote: 龙头不在盘子大小。而在启动的时机。只要先于大盘连续上涨并能带动关联个股上涨，就是龙头
    source: text/58位·上册·第03章.md#page-83
    evidence: 二手
    codable: true
    signal: "IDX 自 20 日低点反弹首日之前 ≥2 日已连续上涨（或连板），且同板块当日涨停≥3 → 龙头候选"
    data_check: 无 trades/
  - id: AK-07
    category: 选股
    rule: 符合热点的相对低位第一根放量大阳线，或二次探底后放量大阳再启动
    quote: 相对低位的第一根放量大阳线。或者说二次探底后的再次启动，必须是放量大阳线
    source: text/58位·上册·第03章.md#page-83
    evidence: 二手
    codable: true
    signal: "T 日涨幅 ≥7% 且 量 ≥ 20 日均量×2 且 收盘处于 120 日区间下 1/3；或 60 日内两次低点相差 <5% 后的首根该类阳线"
    data_check: 无 trades/
  - id: AK-08
    category: 买点
    rule: 追涨找第一次放量上穿 5 日线的热点涨停股；低吸选回到均线附近的龙头
    quote: 追涨找市场热点（最好是第一次放量上穿5日线、涨停品种），低吸选龙头品种（均线附近买）
    source: text/58位·上册·第03章.md#page-85
    evidence: 二手
    codable: true
    signal: "追涨：T-1 收盘<MA5、T 日收盘>MA5 且量≥5 日均量×1.5 且涨停；低吸：龙头候选 买价/MA5-1 ∈ [-2%,+2%]"
    data_check: 无 trades/
  - id: AK-09
    category: 买点
    rule: 早盘和尾盘操作，午盘少做
    quote: 三种方法中，早盘和尾盘做得最多，午间开盘做得少
    source: text/58位·上册·第03章.md#page-85
    evidence: 二手
    codable: true
    signal: "买入时间 ∈ [09:30,10:30] ∪ [14:30,15:00]"
    data_check: 无 trades/
  - id: AK-10
    category: 卖点
    rule: 涨停板操作 90% 以上次日结束
    quote: 涨停板操作，追求的是高买高卖，频率上不快不行。90%以上的操作都必须第二天结束
    source: text/58位·上册·第03章.md#page-83
    evidence: 二手
    codable: true
    signal: "持有天数 = 1（T+1 卖出）"
    data_check: 无 trades/
  - id: AK-11
    category: 买点
    rule: 弱市只参与极度超跌后的反弹
    quote: 弱市中只有一种行情可以参与，那就是极度超跌后的反弹行情
    source: text/58位·上册·第03章.md#page-86
    evidence: 二手
    codable: true
    signal: "弱市中仅当 IDX 自 20 日高点回撤 ≥10% 且 跌停数 pct250 ≥95（待校准）才允许低吸前期热门强势股"
    data_check: 无 trades/
  - id: AK-12
    category: 选股
    rule: 牛市做抗跌不做超跌
    quote: 选股方面，牛市的思路不应做超跌，而应做抗跌(逆势黑马股)
    source: text/58位·上册·第03章.md#page-89
    evidence: 二手
    codable: true
    signal: "IDX>MA60 时，IDX 单日跌≥2% 当天收红/跌幅 <1% 的股票入候选"
    data_check: 无 trades/
  - id: AK-13
    category: 环境
    rule: 下跌末期：成交持续放大、强势板块向上、赚钱效应显现，可进场找感觉
    quote: 实际上在下跌末期，成交已经开始持续放大，强势板块已经开始向上运行，赚钱效应也开始显现
    source: text/58位·上册·第03章.md#page-88
    evidence: 二手
    codable: true
    signal: "IDX<MA60 期间，AMT 5 日均连续 3 日上升 且 涨停数 5 日均 > 20 日均 → 解除空仓，试仓 ≤20%"
    data_check: 无 trades/
  - id: AK-14
    category: 买点
    rule: 出击时机是大盘否极泰来的临界点，借大盘势再借板块势
    quote: 出击的时间，必须把握住大盘否级泰来的临界点。这点最为重要，必须借大盘的势
    source: text/58位·上册·第03章.md#page-93
    evidence: 二手
    codable: false
    signal: ""
    data_check: 无 trades/
  - id: AK-15
    category: 仓位
    rule: 赔钱减注，赢钱加注
    quote: 我是盘盘都赌，赢概率。赔钱就少压，赢了就翻倍压，效果很好
    source: text/58位·上册·第03章.md#page-94
    evidence: 二手
    codable: true
    signal: "下一笔仓位 = 上一笔盈利 ? min(2×上笔, 上限) : 上笔×0.5"
    data_check: 无 trades/
  - id: AK-16
    category: 止损
    rule: 随意操作后次日立即纠错，不纠缠
    quote: 一般随意了一二把，第二天立马就纠错，不会跟他纠缠，然后把他忘记
    source: text/58位·上册·第03章.md#page-91
    evidence: 二手
    codable: true
    signal: "计划外持仓 T+1 无条件卖出"
    data_check: 无 trades/
  - id: AK-17
    category: 环境
    rule: 大盘下跌时最大风险是补跌，比抢反弹风险更大
    quote: 在大盘正在下跌时期，不操作是最好的操作，最大的风险是补跌
    source: text/58位·上册·第03章.md#page-88
    evidence: 二手
    codable: true
    signal: "IDX<MA20 时，前期强势股（20 日涨幅前 5%）当日首次跌幅≥5% → 禁止抄底"
    data_check: 无 trades/
