    category: 心态
    rule: 任何交易系统只在某段时间有效，方法成功到极致时就该回归到零
    quote: "没有任何一种交易系统或方法可以保证长期稳定盈利"
    source: text/浓汤野人_600万到28亿棉花之战.md#page-15
