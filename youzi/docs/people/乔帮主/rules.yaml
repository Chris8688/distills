person: 乔帮主
data_note: "trades/ 24 段 OCR（2012-08~2015-01，22 段集中在 2013-12~2014-03），卖出配对率 64%、精选展示样本；特征为本笔记另算（T-1~T-20 日线，不复权）"
rules:
  - id: QBZ-01
    category: 环境
    rule: 熊市/震荡市用低吸，极强市切换为追涨/打板
    quote: 熊市和震荡市适合低吸，极强市适合追涨和打板
    source: text/58位·中册·第14章.md#page-148
    evidence: 二手
    codable: true
    signal: "弱/震荡 = 上证收盘 < MA20 或 20 日涨幅 < 0 → 允许低吸；强 = 上证 > MA20 且 涨停家数 5 日均值处于近 60 日上 1/3 → 改追涨/打板"
    data_check: "方向一致（小样本）：指数<MA20 时 11 段均值 +5.1% / 胜率 64%；指数>MA20 时 13 段均值 +2.6% / 胜率 69%"
  - id: QBZ-02
    category: 选股
    rule: 只做最强板块里的强势个股（近期连板/大涨、均线多头），不做呆滞冷门股
    quote: 选股要选当时的最强板块中最具领袖气质（基本上是涨幅最大）的个股
    source: text/低吸翘楚“乔帮主”操盘手法揭秘 PDF文章.md#page-3
    evidence: 二手
    codable: true
    signal: "强势股 = 近 10 日涨停数 ≥ 1 或 T-1 收盘/T-11 收盘 - 1 ≥ 10%，且 T-1 收盘 > MA10"
    data_check: "一致：24/24 段满足；近10日有板 83%（中位 2 个），10日涨幅中位 +25.5%，T-1 收 > MA10 占 96%，距 20 日高中位 -5.9%"
  - id: QBZ-03
    category: 买点
    rule: 强势股盘中急跌到日内相对低点时买入，以绿盘（低于昨收）为主
    quote: 我之前基本上是非绿盘不买的
    source: text/顶级游资乔帮主最全精华合集_纯图版.md#page-22
    evidence: 原文
    codable: true
    signal: "首笔买价 < T-1 收盘 且 (买价-日低)/(日高-日低) ≤ 0.3（日线近似；严格版需分时：买入前 30 分钟价格下行）"
    data_check: "一致：低吸(<昨收) 79.2%，其余为平盘 0~+1.5%，0 段 ≥+3%；日内位置中位 0.23，≤0.3 的 15 段胜率 80% 均值 +6.1%，其余 9 段胜率 44% 均值 -0.3%"
  - id: QBZ-04
    category: 买点
    rule: 低吸 = 买入瞬间价格在下跌（越来越便宜），与涨跌幅正负无关
    quote: 很多人以为-3买就是低吸。错误的！
    source: text/顶级游资乔帮主最全精华合集_纯图版.md#page-35
    evidence: 原文
    codable: true
    signal: "分时：买入时刻价格 < 前 N 分钟最高价 且 处于下跌段（需 1 分钟线，日线不可算）"
    data_check: "无法检验（无分时数据）"
  - id: QBZ-05
    category: 卖点
    rule: 隔日超短，次日除非涨停一律卖出
    quote: 买完第二天除非涨停，必卖
    source: text/乔帮主3年半500倍(20万-1亿元)经历.md#page-8
    evidence: 原文
    codable: true
    signal: "T+1 未封涨停 → T+1 卖出（低开 → 开盘卖；高开 → 冲高回落卖）；T+1 封板 → 持有至 T+2"
    data_check: "一致：持有 1 天 87.5%；次日低开 7 段 ret 与 T+1 开盘溢价差中位 +0.4pp（开盘即走），次日高开 14 段 ret 中位 +8.8%"
  - id: QBZ-06
    category: 止损
    rule: 买错不在低位补仓摊薄成本，破位第一时间离场
    quote: 如果手痒买了，千万不要低位继续补仓摊薄成本，这是超短大忌
    source: text/58位·中册·第14章.md#page-151
    evidence: 二手
    codable: true
    signal: "持仓浮亏时禁止同标的加仓；收盘跌破买入日最低价 → 次日离场"
    data_check: "部分冲突：东易日盛 2014-03-03/04/06 连续三段反复买回（第二、三段均亏）；精华合集#page-16 他自述失败后'甚至要补仓'"
  - id: QBZ-07
    category: 空仓
    rule: 市场赚钱效应差就出局观望，用逆回购控制回撤与交易频率
    quote: 知道市场赚钱效应差就应该要出局观望
    source: text/58位·中册·第14章.md#page-157
    evidence: 二手
    codable: true
    signal: "赚钱效应差 = T-1 昨日涨停股今日平均涨幅 < 0 连续 2 日 或 涨停家数 < 跌停家数 → 不开新仓、资金做逆回购"
    data_check: "无法检验（OCR 不含空仓期；他自述实际常年满仓+融资，见精华合集#page-16）"
  - id: QBZ-08
    category: 买点
    rule: 熊市只吃恐慌盘：千股跌停次日下午恐慌极值，或非千股跌停日的尾盘杀跌
    quote: 千股跌停第二天，恐慌到下午的时候……在这个位置抄底，胜算很大
    source: text/顶级游资乔帮主最全精华合集_纯图版.md#page-12
    evidence: 原文
    codable: true
    signal: "T-1 跌停家数 ≥ 1000（或 ≥ 全市场 25%）且 T 日 14:00 后指数创日内新低 → 尾盘买强势股；平时：非千股跌停日 14:30 后急跌"
    data_check: "无法检验（24 段无千股跌停日样本）"
  - id: QBZ-09
    category: 仓位
    rule: 按赢面（胜率与涨跌空间比）分档定仓位
    quote: 赢面60%以下观望，赢面60%-70%小仓出击……90%以上满仓
    source: text/顶级游资乔帮主最全精华合集_纯图版.md#page-40
    evidence: 原文
    codable: true
    signal: "仓位 = 0（p<0.6）/ 小（0.6-0.7）/ 中（0.7-0.8）/ 大（0.8-0.9）/ 满（≥0.9 且 上行空间/下行空间 ≥ 6）；p 需由历史同形态胜率估计"
    data_check: "待核：该段来源疑为编者转录的通行语录；交割单显示几乎每段都重仓（平均每段 116.8 万）"
  - id: QBZ-10
    category: 心态
    rule: 只跟随不预判；预判抄底是最大回撤来源
    quote: 以后再预判就是傻逼！……我90%的回撤都是来源于此
    source: text/58位·中册·第14章.md#page-151
    evidence: 二手
    codable: false
    signal: ""
    data_check: "无法检验"
  - id: QBZ-11
    category: 选股
    rule: 大跌后抄底只抄强势板块龙头、超跌后缩量均匀的品种，反弹开长阳卖，若涨停次日冲高卖
    quote: 抄底牛股须符合：1，强势板块龙头股；2，超跌后缩量均匀的品种
    source: text/58位·中册·第14章.md#page-155
    evidence: 二手
    codable: true
    signal: "候选 = 前期板块龙头（20 日涨幅板块第 1）且 自高点回撤 ≥ 20% 且 近 5 日成交量 < 20 日均量×0.6、日间量能变异系数低；卖 = 首根实体 ≥ 5% 阳线收盘或 涨停次日冲高"
    data_check: "无法检验（24 段距 20 日高中位仅 -5.9%，不是超跌形态）"
  - id: QBZ-12
    category: 环境
    rule: 不参与调整段；主升浪要靠追涨/打板，低吸做不来主升
    quote: 一定不能参与调整段，一定要做主升，主升才是王道，而主升是低吸不来的
    source: text/乔帮主3年半500倍(20万-1亿元)经历.md#page-6
    evidence: 原文
    codable: false
    signal: ""
    data_check: "与低吸期数据相互印证：华森制药、泰禾集团主升前都买过但早早下车（揭秘#page-11，二手）"
  - id: QBZ-13
    category: 心态
    rule: 承认低吸确定性低、是腰斩式回撤之源，资金做大后改为追涨为主
    quote: 正是低吸造成了我可以一天赚17%……也正是低吸能让我一个月腰斩
    source: text/顶级游资乔帮主最全精华合集_纯图版.md#page-5
    evidence: 原文
    codable: false
    signal: ""
    data_check: "交割单无法检验（OCR 截止 2014-03，之后的腰斩期没有交割单）；精华合集#page-11 自述 6 次 30-50% 回撤，与 PF 20.6 的精选样本形成对照"
  - id: QBZ-14
    category: 空仓
    rule: 弱市中空仓；弱市只在逻辑性极高、限制极严时才做，戒掉追最低点的盲目抄底
    quote: 学会了在弱势中空仓……我绝大多数回撤都来自于此
    source: text/乔帮主3年半500倍(20万-1亿元)经历.md#page-9
    evidence: 原文
    codable: true
    signal: "弱市 = 上证 < MA20 且 20 日跌幅 > 5%：新开仓需同时满足 QBZ-02 与 QBZ-08，否则空仓"
    data_check: "部分冲突：2013-12~2014-01 上证低于 MA20 的 11 段仍持续开仓且盈利（均值 +5.1%），并未空仓"
