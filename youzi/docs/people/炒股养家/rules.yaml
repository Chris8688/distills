person: 炒股养家
# 说明
# - source 锚点：pdf/OCR 文件用 #page-N（N = 文本里的 <!-- page N --> 锚点，不是书上印的页码）；
#   淘股吧帖子导出的 doc/docx（无页码）用 #post-YYYY-MM-DDTHH:MM（帖子发表时间，可在文本里 grep 到）。
# - evidence：原文 = 带时间戳、署名"原创：炒股养家"的帖子（含经合集 OCR 转录的帖子）；
#   二手 = 编者整理/解读/伪托（58位、心法汇总、图文解读、《养家心法传记》）；实盘反推 = 只来自 trades/ 的数字。
# - signal 里的阈值凡是写了"参数待定/我们的参数化"的，是蒸馏者把原文定性描述翻成可算口径，未经回测，不是他说的数字。
# - 实盘数据：trades/ 为 2010-04-01 ~ 2010-08-26 的 OCR 交割单，403 笔、90 段，卖出配对率 74%，5-6 月明显缺页。
rules:
  - id: YJ-01
    category: 环境
    rule: '交易本质是场外买入力量与场内卖出倾向的比较；买入倾向看赚钱效应，卖出倾向看亏钱效应，前者大于后者就买，反之就卖'
    quote: '随时衡量，场外的潜在买入者的钱的数量和买入倾向，与场内筹码的数量和卖出倾向'
    source: 'text/股票交易的最优化模式的个人浅见.md#post-2011-04-13T20:52'
    evidence: 原文
    codable: false
    signal: ''
    data_check: '框架性陈述，无法直接检验'

  - id: YJ-02
    category: 环境
    rule: '情绪温度计 = 昨日涨幅前 20 名今天的表现（柏拉爱空指标，衡量追涨者盈亏），他另外加上领跌品种，以及各个周期阶段的领涨、领跌板块'
    quote: '以前一天涨幅前20名的个股第二天的表现为基准，类似这样的统计指标就是市场情绪的一部分'
    source: 'text/养家心法论股市.md#post-2012-08-18T23:37'
    evidence: 原文
    codable: true
    signal: 'E_up(T) = T 日收益均值，样本为 T-1 涨幅前 20 名（剔除新股、一字未开板、ST）；E_dn(T) = T-1 跌幅前 20 名的 T 日收益均值。赚钱效应 = E_up 的 3 日均值 > 0；亏钱效应 = E_up 的 3 日均值 < 0，且跌幅榜前 50 名里有 T-5 以来涨停过的股票（参数待定）'
    data_check: '交割单期间无法检验（需要全市场行情）；可以单独回测这个指标对下一日涨停溢价的预测力'

  - id: YJ-03
    category: 环境
    rule: '盯两类人群——追涨者赚不赚钱决定热点能否持续，抄底者赚不赚钱决定会不会崩溃；抄底者开始亏钱、抄底减少，是崩溃的前兆'
    quote: '而一旦抄底的人开始减少，部分股票稍有卖压便产生无抵抗式下跌，这即是逐步引发崩溃的前兆'
    source: 'text/养家心法论股市.md#post-2012-08-18T23:37'
    evidence: 原文
    codable: true
    signal: '抄底者盈亏代理 B(T) = 前 20 日跌幅最大的 50 只股票（或 120 日跌幅最大的 3 个申万二级行业）在 T 日的收益均值；B 连续 2 日 < 0 且这批股票再创 20 日新低 → 崩溃前兆 = true'
    data_check: '无法用交割单检验'

  - id: YJ-04
    category: 环境
    rule: '崩溃预警的具体盘面——领跌品种里出现近期强势股（打击追涨者），同时 90-120 天周期级别的超跌板块再度领跌（套住抄底者），这时先空仓或低仓回避'
    quote: '90-120天周期级别的，煤炭水泥等品种今天再度有领跌倾向'
    source: 'text/养家心法论股市.md#post-2012-08-24T13:54'
    evidence: 原文
    codable: true
    signal: '跌幅榜前 50 名中 T-10 以来涨停过的股票占比 ≥ 20%，且 120 日跌幅最大的 5 个行业中有 ≥ 2 个当日跌幅排在全行业后 10% → 崩溃预警，目标总仓 ≤ 2 成（阈值为我们的参数化）'
    data_check: '无法用交割单检验（交割单只到 2010-08）'

  - id: YJ-05
    category: 环境
    rule: '"崩溃"的定量定义——较大面积跌停（几十到上百家），不少品种出现 20-30% 以上的跌幅'
    quote: '特征上有较大面积跌停（几十到上百家），幅度上不少品种有20-30%以上跌幅'
    source: 'text/养家心法论股市.md#post-2012-08-24T13:34'
    evidence: 原文
    codable: true
    signal: '崩溃日 = 非 ST 跌停家数 ≥ 50，且近 10 日累计跌幅 ≤ -20% 的个股数 ≥ 全 A 的 5%（家数是 2012 年约 2400 只股票时的口径，现在应按全 A 数量等比放大，参数待定）'
    data_check: '无法用交割单检验'

  - id: YJ-06
    category: 环境
    rule: '情绪演变五步——酝酿 → 开展 → 逐步蔓延（场内筹码从"下跌空间有限"转为失望离场，同时场外资金在累积）→ 情绪逆转 → 资金蜂拥而入，循环往复'
    quote: '酝酿的话，那么现在就是开展了，之后有个逐步蔓延的过程'
    source: 'text/养家心法论股市.md#post-2012-08-27T11:37'
    evidence: 原文
    codable: false
    signal: '只能用 YJ-04（酝酿）→ YJ-05（开展/蔓延）→ YJ-10（逆转）组合近似'
    data_check: '无'

  - id: YJ-07
    category: 环境
    rule: '弱势三段，各配一种打法——初段低吸止损盘（前期强势股的回调反抽、新热点），中段低吸崩溃盘（超跌股，重在时机），末段追涨强势（符合主流、有爆发力的新故事）'
    quote: '弱势初段低吸止损，弱势中段低吸崩溃，弱势末段追涨强势'
    source: 'text/炒股养家等一线游资_纯图版.md#page-52'
    evidence: 原文
    codable: true
    signal: '初段：指数 < MA20，但前期 20 日涨幅前 50 名的中位数仍收在其 MA20 之上；中段：这批强势股的中位数跌破 MA20，且出现过 YJ-05 崩溃日；末段：最弱板块（如当时的创业板）10 日以上不创新低，同时出现 ≥ 2 只大盘股或新题材股涨停（取自 text/论反弹.md#post-2011-06-14T13:15 的盘面描述，阈值待定）'
    data_check: '无法用交割单检验；他本人 2011-06-22 承认那次"末期"判断失误（text/论反弹.md#post-2011-06-22T16:57）'

  - id: YJ-08
    category: 环境
    rule: '下跌趋势四阶段（2011-01 版）——初期做仍有主升能力的品种，二阶段做大周期超跌品种，三阶段只参与个股性机会、耐心等待，末段恐慌极度扩散之后会出现一个有持续性的热点领导上涨，这个由弱转强的阶段是全力出击的时候'
    quote: '这个由弱转强的阶段，将是短线投资者奋力博取利润的绝佳机会'
    source: 'text/炒股养家100万到600万前.md#post-2011-01-24T18:07'
    evidence: 原文
    codable: false
    signal: '阶段归属靠主观判断；末段的''持续性热点''要求同时在政策面、技术面、资金面形成共振，无法机械化'
    data_check: '无'

  - id: YJ-09
    category: 心态
    rule: '阶段模型只是辅助，真正的重点是多空双方的心理；预测为末，应变为本'
    quote: '我建立了下跌3，4阶段的模型本意也是辅助对于市场心理的理解'
    source: 'text/炒股养家等一线游资_纯图版.md#page-59'
    evidence: 原文
    codable: false
    signal: ''
    data_check: '无'

  - id: YJ-10
    category: 环境
    rule: '由弱转强、恢复右侧追涨的条件——市场上没有跌停了，跌幅榜普遍只跌 2-3 个点'
    quote: '等市场没有跌停了，跌幅榜普遍也就跌2、3个点的时候，再进行强势攻击'
    source: 'text/炒股养家等一线游资_纯图版.md#page-53'
    evidence: 原文
    codable: true
    signal: '非 ST 跌停家数 ≤ 2，且全 A 跌幅第 20 名 ≥ -3%（若取跌幅第 50 名则 ≥ -2.5%，参数待定），满足 1 日即允许追涨；跟 YJ-02 的 E_up > 0 同时成立时可以加到重仓'
    data_check: '无法用交割单检验'

  - id: YJ-11
    category: 买点
    rule: '超跌出击点——大盘连续下跌一段后再出大阴线、指数远离 5 日线，同时超跌板块连续下跌后再度集体大幅杀跌，两者同时出现'
    quote: '连续下跌一段后，再出现大阴线，指数远离5日线'
    source: 'text/炒股养家100万到600万前.md#post-2010-05-29T20:00'
    evidence: 原文
    codable: true
    signal: '指数 5 日累计跌幅 ≤ -5%、当日跌幅 ≤ -2%、收盘相对 MA5 偏离 ≤ -3%；同时某个行业指数 20 日跌幅排前 3，当日跌幅 ≤ -4%，成分股跌停 ≥ 3 只 → 当日尾盘或次日低开买该行业弹性股，次日冲高卖出（阈值为我们的参数化）'
    data_check: '定性一致：2010-07-02/05 有超跌低吸（新大陆等），T+1 开盘小赚卖出（图文解读1#page-3）；但低吸类 25 段 PF 0.60、净亏 1.2 万（entry_types.md），说明 2010 年超跌低吸不赚钱，和他''左侧如鸡肋''的自述一致'

  - id: YJ-12
    category: 卖点
    rule: '顶部警示——连续上涨一段之后出现的集体涨停要特别小心，不追'
    quote: '连续上涨一段后的集体涨停就要小心了'
    source: 'text/股票交易的最优化模式的个人浅见.md#post-2011-04-13T21:21'
    evidence: 原文
    codable: true
    signal: '行业指数 10 日涨幅 ≥ 15%，且当日成分股涨停数创近 20 日最大、≥ 5 只 → 该行业禁止新开仓，已有仓位冲高减（参数待定）'
    data_check: '无'

  - id: YJ-13
    category: 环境
    rule: '超跌品种是强势股的晴雨表——超跌品种稳住了，强势股机会就大；超跌品种继续创新低，强势股补跌在即'
    quote: '超跌的品种继续创新低，强势的个股补跌在即'
    source: 'text/炒股养家100万到600万前.md#post-2010-05-29T20:02'
    evidence: 原文
    codable: true
    signal: '领跌板块（如 2010 年的地产、2011 年的创业板）指数创 20 日新低 → 持有的 20 日涨幅前列股票减仓；领跌板块 ≥ 5 日不创新低 → 允许围绕主流强势股操作（2010-05-26 原文：以地产为风向标，地产企稳就做新能源，地产回落就减仓）'
    data_check: '无法检验（需要板块指数，交割单不含意图）'

  - id: YJ-14
    category: 买点
    rule: '外围市场通常只影响 A 股开盘，可以反着做——美股大涨就开盘卖，美股大跌就开盘买'
    quote: '外围通常只影响开盘，因此部分情况下可以利用外围股市做反向操作'
    source: 'text/炒股养家100万到600万前.md#post-2010-05-29T20:00'
    evidence: 原文
    codable: true
    signal: '隔夜标普 500 ≥ +1.5% → A 股持仓集合竞价/开盘减；≤ -1.5% 且处于恐慌释放期（YJ-05 已触发）→ 开盘低吸（例：text/炒股养家等一线游资_纯图版.md#page-55，2011-08-10/11）'
    data_check: '无'

  - id: YJ-15
    category: 仓位
    rule: '总仓位和全市场成交量正相关——量能低迷不支持板块性行情，只能做局部热点、隔日超短'
    quote: '短线好手仓位的高低通常会与市场整体交易量呈现一定的正相关性'
    source: 'text/养家心法论股市.md#post-2012-08-18T23:16'
    evidence: 原文
    codable: true
    signal: '目标总仓上限 = f(全 A 成交额的 250 日分位)；分位 < 30% → 总仓 ≤ 3 成，只做隔日；分位 > 70% 且 YJ-10 成立 → 允许满仓（映射为我们的参数化）'
    data_check: '无法检验（交割单期间成交额数据未接）'

  - id: YJ-16
    category: 选股
    rule: '先给热点定性（主流 / 次主流 / 支流 / 非主流），再决定持有周期和仓位——主流反复做、可重仓，次主流周期更短，非主流轻仓、隔日卖'
    quote: '若是次主流，有绝佳机会也可以重仓搏杀，若是非主流，轻仓参与，隔日卖出'
    source: 'text/炒股养家100万到600万后.md#post-2011-03-05T17:24'
    evidence: 原文
    codable: false
    signal: '主流 = 持续时间长、可以反复活跃，来源通常是国家大级别战略（text/养家心法论股市.md#post-2012-09-02T22:13）。可以近似为''近 60 日内该题材出现 ≥ 3 波涨停潮（单日涨停 ≥ 5 只）''，但他的定性主要靠政策判断，不建议当成机械规则'
    data_check: '实例一致：2011-03-14 美罗药业（主流新故事）7 成仓，格力地产（非主流）1 成仓、隔日卖（text/炒股养家100万到600万后.md#post-2011-03-14T17:40）'

  - id: YJ-17
    category: 选股
    rule: '主流热点里出现新故事，是一年里少数几次赚大钱的机会，值得重仓'
    quote: '符合主流热点的新故事，往往是赚大钱的机会'
    source: 'text/炒股养家100万到600万后.md#post-2011-03-14T17:38'
    evidence: 原文
    codable: false
    signal: ''
    data_check: '定性一致：交割单里最大一笔盈利是联环药业（2010-08-16 超级细菌，医药主流里的新故事），+22.7%、24.7 万，占 90 段净利的 71%（entry_types.md / profile.md）'

  - id: YJ-18
    category: 选股
    rule: '强势阶段选强（赚钱效应下的后来资金更容易选中强者），弱势阶段低吸宣泄殆尽的品种（恐慌盘出尽后少量买盘就能推动上涨）'
    quote: '强的标的被后来资金选中的概率大，所以选强'
    source: 'text/股票交易的最优化模式的个人浅见.md#post-2011-04-13T21:38'
    evidence: 原文
    codable: true
    signal: 'if YJ-10 成立且 E_up > 0: 候选 = 20 日涨幅前 5% 且属当日热点（YJ-19）；else if YJ-05/YJ-11 触发: 候选 = 20 日跌幅前 5%；否则空仓'
    data_check: '无法分离检验'

  - id: YJ-19
    category: 选股
    rule: '热点 = 成批创新高、或近期连续大涨的股票的共性（多看涨幅榜和异动榜的共性）；同等条件下选小盘低价，爆发力更好'
    quote: '那些成批的创新高的或则近期连续大涨的股票所具有的最多的共性就是热点'
    source: 'text/炒股养家100万到600万前.md#post-2011-01-27T23:53'
    evidence: 原文
    codable: true
    signal: '当日创 60 日新高、或 5 日涨幅 ≥ 20% 的个股，按概念/申万三级聚类，成员 ≥ 5 只的类 = 热点；类内按流通市值升序、股价升序排列（小盘低价优先，见 text/论反弹.md#post-2011-06-14T18:34）'
    data_check: '无法检验（交割单没有买入理由）'

  - id: YJ-20
    category: 买点
    rule: '龙头和跟风是套利关系——龙头超预期上涨时，同题材里尚处低位的品种会被激发补涨（他称为"套利性机会"）；买龙头是因为板块动能带来的溢价还没反映到股价上'
    quote: '是因为龙头赚钱效应十足，而部分跟风品种尚处低位'
    source: 'text/养家心法论股市.md#post-2012-08-22T23:48'
    evidence: 原文
    codable: true
    signal: '题材龙头（题材内连板数最高者）T 日一字或 10:00 前封板 → T 日或 T+1 买同题材中 20 日涨幅 < 10%、流通市值最小的 1-2 只，持有 1-2 日'
    data_check: '定性一致：图文解读2#page-23/24，动力源、证通电子是成飞集成（停牌中的龙头）带动下的充电桩后排；普洛股份等是联环药业带动下的超级细菌深挖（二手解读），均为 1-2 日的小肉'

  - id: YJ-21
    category: 选股
    rule: '三种涨停板容易被砸，不打——不符合主流热点的、不明原因的、累计涨幅过大的'
    quote: '1.不符合和主流热点的 2.不明原因的 3.累计涨幅过大的'
    source: 'text/股票交易的最优化模式的个人浅见.md#post-2011-04-13T18:35'
    evidence: 原文
    codable: true
    signal: '剔除：不属于任何当日热点类（YJ-19）的涨停股、20 日涨幅 > 60% 的涨停股（阈值待定）；''不明原因''需要公告/新闻数据'
    data_check: '无'

  - id: YJ-22
    category: 买点
    rule: '预判 → 试错 → 确认 → 加仓——主流热点不必等涨停，先买、确认强度后加仓；不是主流就等，强度够才排龙头的板'
    quote: '先判定是否主流热点，如是，不必等涨停也可随时先买入，等确认强度后再行加仓'
    source: 'text/股票交易的最优化模式的个人浅见.md#post-2011-04-13T21:38'
    evidence: 原文
    codable: false
    signal: '''确认''没有给出可算标准；他明确说试错和下跌多少无关（text/炒股养家100万到600万前.md#post-2010-11-17T23:37）'
    data_check: '定性一致：半路 23 段 + 平盘 35 段，均额只有 26-32 万，净利合计 -4.0 万，符合"小单试错、结果不重要"（见 YJ-45）'

  - id: YJ-23
    category: 买点
