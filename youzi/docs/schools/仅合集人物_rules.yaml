# 仅有《58位大佬心法》章节的 18 位人物 · 合并规则表
# 全部证据等级 = 二手（编者整理/转述；水印 98kecheng = 倒卖课程站）。无 trades/ 数据，data_check 一律留空。
# source 路径相对于 distill/ 根目录；#page-N = 该章 text 文件中 <!-- page N --> 锚点。
rules:
  # ---------------- 艾琳歆（期货/趋势，如何抓住大波段）----------------
  - id: ALX-01
    person: 艾琳歆
    category: 止损
    rule: 单笔亏损约 10 个点即考虑止损（非绝对）；持有盈利单是最安全的行为
    quote: 大多数情况下，10个点我就考虑止损，但不是绝对的。任何时候，持有盈利单都是最安全的交易行为
    source: 人物/艾琳歆/text/58位·上册·第07章.md#page-123
    evidence: 二手
    codable: true
    signal: 持仓浮亏 ≤ -10%（期货语境为 10 个点）→ 平仓；无固定止盈
    data_check: ""
  - id: ALX-02
    person: 艾琳歆
    category: 卖点
    rule: 不做主动止盈，允许浮盈回吐到保本（平推），以换取抓到大波段
    quote: 如果你随时被落袋为安的思想左右，那么你永远不可能打到几十点
    source: 人物/艾琳歆/text/58位·上册·第07章.md#page-127
    evidence: 二手
    codable: true
    signal: 出场只由止损/趋势反转触发；无「浮盈 X% 止盈」条款
    data_check: ""
  - id: ALX-03
    person: 艾琳歆
    category: 止损
    rule: 方向常对却总被止损打出时，放大止损幅度而不是放弃系统
    quote: 你不知道把止损幅度或者平推幅度放大一些么
    source: 人物/艾琳歆/text/58位·上册·第07章.md#page-128
    evidence: 二手
    codable: false
    signal: ""
    data_check: ""
  - id: ALX-04
    person: 艾琳歆
    category: 心态
    rule: 选定行情级别：要抓大级别就放弃小级别波段，不两头都要
    quote: 为了抓住10万盈利级别的行情，你就必须学会放弃1-2万级别的行情
    source: 人物/艾琳歆/text/58位·上册·第07章.md#page-128
    evidence: 二手
    codable: false
    signal: ""
    data_check: ""
  - id: ALX-05
    person: 艾琳歆
    category: 空仓
    rule: 看不懂的行情不参与；连续亏损时停手休息而不是急于扳回
    quote: 我不会把自己置身于看不懂的行情中，所以错过很多行情
    source: 人物/艾琳歆/text/58位·上册·第07章.md#page-126
    evidence: 二手
    codable: false
    signal: ""
    data_check: ""

  # ---------------- 六哥（知道 做到 赚到）----------------
  - id: LG-01
    person: 六哥
    category: 买点
    rule: 机会风险比 >3:1 才出手，<3:1 不做
    quote: 机会风险比大于3:1时，不要怂，小于3:1时，管住手
    source: 人物/六哥/text/58位·上册·第10章.md#page-149
    evidence: 二手
    codable: true
    signal: （目标价 − 入场价）/（入场价 − 止损价）> 3 才允许开仓；目标价定义待核（原文未给）
    data_check: ""
  - id: LG-02
    person: 六哥
    category: 空仓
    rule: 月度回撤超过 10% 先停下复盘，不继续交易
    quote: 月度回撤超过10%时，先停下来，冷静分析原因
    source: 人物/六哥/text/58位·上册·第10章.md#page-149
    evidence: 二手
    codable: true
    signal: 账户净值 / 当月月初净值 − 1 < -10% → 当月剩余交易日暂停开新仓
    data_check: ""
  - id: LG-03
    person: 六哥
    category: 选股
    rule: 只做当日主流热点的「三龙」（板块前三龙头），主流判断不清就放弃
    quote: 真正应该做的，就是做每天主流热点的三龙
    source: 人物/六哥/text/58位·上册·第10章.md#page-151
    evidence: 二手
    codable: true
    signal: 当日涨停数最多的概念板块 = 主流；板块内按连板高度/首封时间排前三 = 三龙
    data_check: ""
  - id: LG-04
    person: 六哥
    category: 环境
    rule: 竞价看被「顶一字」的票属于哪个板块、是否整板联动，以此验证/修正主流
    quote: 很多时候竞价被顶一字的股票，就多看一下，是炒什么板块，是不是整个板块都来了
    source: 人物/六哥/text/58位·上册·第10章.md#page-152
    evidence: 二手
    codable: true
    signal: 9:25 开盘价 = 涨停价 的个股按板块计数，同板块 ≥ N 只 → 当日主流候选（N 待定）
    data_check: ""
  - id: LG-05
    person: 六哥
    category: 心态
    rule: 每月复盘亏损最大的五笔，追踪月最大回撤与胜率是否改善
    quote: 每月对亏损最大五笔，深刻反省，总结原因
    source: 人物/六哥/text/58位·上册·第10章.md#page-149
    evidence: 二手
    codable: false
    signal: ""
    data_check: ""

  # ---------------- 缠中说禅（高手都是哲学家）----------------
  - id: CZ-01
    person: 缠中说禅
    category: 选股
    rule: 牛市找牛股：放量突破上市首日最高价的新股；放量突破年线后缩量回踩年线的老股；年线下方的不看
    quote: 盯着所有放量突破上市首日最高价的新股以及放量突破年线然后缩量回调年线的老股
    source: 人物/缠中说禅/text/58位·上册·第11章.md#page-155
    evidence: 二手
    codable: true
    signal: 老股：close 上穿 MA250 且当日量 > 20 日均量×1.5，随后 N 日内 low 触及 MA250±2% 且量 < 20 日均量 → 候选；close < MA250 → 剔除。新股：close > 上市首日 high 且放量
    data_check: ""
  - id: CZ-02
    person: 缠中说禅
    category: 卖点
    rule: 缓慢推升的票一旦加速就找出货机会；第一波暴涨的票，第二波出现背驰或放巨量就走
    quote: 一种是缓慢推升的，一旦出现加速上涨，就要时刻注意出货的机会
    source: 人物/缠中说禅/text/58位·上册·第11章.md#page-156
    evidence: 二手
    codable: true
    signal: 近 20 日斜率 < 近 5 日斜率×阈值（加速）→ 进入卖出观察；第二波 high 创新高但 MACD 柱面积 < 第一波 或 量 > 20 日均量×3 → 卖出
    data_check: ""
  - id: CZ-03
    person: 缠中说禅
    category: 买点
    rule: 创新高不等于买点，须先排除大级别背驰
    quote: 创新高的股票，必须注意有没有大级别背驰
    source: 人物/缠中说禅/text/58位·上册·第11章.md#page-160
    evidence: 二手
    codable: true
    signal: 周线 close 创 52 周新高 但 周线 MACD 柱/DIF 未创新高 → 视为背驰，不追
    data_check: ""
  - id: CZ-04
    person: 缠中说禅
    category: 卖点
    rule: 宁愿卖早不要卖晚；卖错了不追高买回，等新买点
    quote: 只要是赚钱的，就没有卖错，宁愿卖早，不要卖晚
    source: 人物/缠中说禅/text/58位·上册·第11章.md#page-160
    evidence: 二手
    codable: false
    signal: ""
    data_check: ""
  - id: CZ-05
    person: 缠中说禅
    category: 止损
    rule: 买错比卖错严重，确认买错立即砍
    quote: 买错比卖错严重，一旦确认买错了，一定要手起刀落
    source: 人物/缠中说禅/text/58位·上册·第11章.md#page-163
    evidence: 二手
    codable: false
    signal: ""
    data_check: ""
