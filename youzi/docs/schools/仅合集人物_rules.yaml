    category: 环境
    rule: 震荡/熊市里，大盘急跌 10%~15% 以上是抢反弹机会；连续地量是中级反弹机会
    quote: 如果大盘出现了一个10%～15%以上的急跌
    source: 人物/无门问禅/text/58位·上册·第12章.md#page-168
