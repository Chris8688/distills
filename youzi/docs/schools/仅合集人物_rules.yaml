  - id: DXR-03
    person: 灯心人
    category: 买点
    rule: 持有加速板，但不接力加速板（加速板是卖方市场）；一字龙头不参与
    quote: 所以我喜欢持有加速板的票，但却不会去接力加速板
    source: 人物/灯心人/text/58位·上册·第14章.md#page-186
