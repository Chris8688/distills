    rule: 真大涨股涨停次日放量走强、不回到昨收下；若次日缩量跌回昨收下，说明主力已走，第三天多低开低走
    quote: 如果缩量回调到上一日收盘价下，则说明主力上一日已经走了
    source: 人物/无门问禅/text/58位·上册·第12章.md#page-173
    evidence: 二手
    codable: true
    signal: T 日涨停；T+1 low < T 收盘 且 T+1 量 < T 量 → T+1 尾盘卖 / 不接；检验 T+2 开盘 < T+1 收盘 的条件概率
