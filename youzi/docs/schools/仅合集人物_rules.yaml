    source: 人物/灯心人/text/58位·上册·第14章.md#page-189
    evidence: 二手
    codable: true
    signal: T 日以涨停价买入 且 T 收盘 < 涨停价（炸板）→ T+1 竞价卖出（成交价 = T+1 开盘价）
    data_check: ""
  - id: DXR-02
    person: 灯心人
    category: 卖点
    rule: 两个经典卖点：跌破开盘价；绿盘无法翻红
    quote: 一个是跌破开盘价，一个是绿盘无法冲红，都应该先出来观望
    source: 人物/灯心人/text/58位·上册·第14章.md#page-189
    evidence: 二手
    codable: true
    signal: 分时价 < 当日开盘价 → 卖；或 开盘 < 昨收 且 盘中始终未 > 昨收（日线近似：开盘 < 昨收 且 high < 昨收）→ 卖
