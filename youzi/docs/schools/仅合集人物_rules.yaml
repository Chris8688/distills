    codable: true
    signal: 大盘 close > MA20 且 个股近 10 日涨幅前 5% → 盘中 low ≤ MA5 且 close ≥ MA5 买；close < MA5 卖
    data_check: ""
  - id: WMWC-02
    person: 无门问禅
    category: 卖点
