    codable: true
    signal: 上证指数 close / 近 20 日最高 close − 1 ≤ -10% → 反弹窗口；成交额 < 近 250 日 10% 分位 连续 ≥ 3 日 → 地量
    data_check: ""
  - id: WMWC-05
