  # ---------------- 灯心人（核按钮）----------------
  - id: DXR-01
    person: 灯心人
    category: 止损
    rule: 买到「垃圾」（打板被砸、收盘未封住），次日集合竞价直接挂跌停卖出，不意淫反包
